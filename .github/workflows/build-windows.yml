name: Build Windows Client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: windows-2022,
              platform: x64,
            }
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: Build Windows x64 Executable
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.7"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.x"
          cache: true

      - name: Download Bridge Artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Download TopMostWindow Artifact
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: flutter/windows/runner/resources

      - name: Stage Driver Bundle and Virtual Monitor Helpers
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" -OutFile "usbmmidd_v2.zip"
          Expand-Archive "usbmmidd_v2.zip" -DestinationPath .
          Remove-Item -Path "usbmmidd_v2\Win32" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "flutter/windows/runner/resources/usbmmidd_v2" -Force | Out-Null
          Copy-Item -Path "usbmmidd_v2/*" -Destination "flutter/windows/runner/resources/usbmmidd_v2" -Recurse -Force

      - name: Build Windows Flutter App
        shell: bash
        run: |
          cd flutter
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Package Output Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build_output" -Force | Out-Null
          Copy-Item -Path "flutter/build/windows/x64/runner/Release/*" -Destination "build_output" -Recurse -Force

      - name: Upload Windows x64 Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpecterRemote-Windows-x64
          path: build_output/
