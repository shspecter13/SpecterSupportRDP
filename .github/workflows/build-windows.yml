name: Build Windows Client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: windows-2022,
              platform: x64,
            }
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: Build Windows x64 Executable
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.7"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.x"
          cache: true

      - name: Restore Bridge Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Restore TopMostWindow Artifact
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: flutter/windows/runner/resources

      - name: Ensure TopMostWindow Binary Placement
        shell: pwsh
        run: |
          # Ensure the binary is at the exact root of resources/
          $exe = Get-ChildItem -Path "flutter/windows/runner/resources" -Recurse -Filter "RustDeskTempTopMostWindow.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe -and $exe.DirectoryName -ne (Resolve-Path "flutter/windows/runner/resources").Path) {
            Copy-Item -Path $exe.FullName -Destination "flutter/windows/runner/resources/RustDeskTempTopMostWindow.exe" -Force
          }

      - name: Stage Driver & Virtual Display Bundle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" -OutFile "usbmmidd_v2.zip"
          Expand-Archive "usbmmidd_v2.zip" -DestinationPath .
          Remove-Item -Path "usbmmidd_v2\Win32" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "flutter/windows/runner/resources/usbmmidd_v2" -Force | Out-Null
          Copy-Item -Path "usbmmidd_v2/*" -Destination "flutter/windows/runner/resources/usbmmidd_v2" -Recurse -Force

      - name: Build Windows Flutter Release
        shell: bash
        run: |
          cd flutter
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Package Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "SpecterRemote_x64" -Force | Out-Null
          Copy-Item -Path "flutter/build/windows/x64/runner/Release/*" -Destination "SpecterRemote_x64" -Recurse -Force

      - name: Upload Windows x64 Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpecterRemote-Windows-x64
          path: SpecterRemote_x64/
