name: Build Windows Client

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: windows-2022, platform: x64 }
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: Build Windows x64 Executable
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Bridge Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter SDK
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace Engine with RustDesk Custom Flutter Engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = Join-Path -Path (Split-Path (Get-Command flutter).Source) -ChildPath "cache/artifacts/engine/windows-x64-release"
          Copy-Item -Path windows-x64-release/* -Destination $engineDir -Recurse -Force

      - name: Patch Flutter Dropdown
        shell: bash
        run: |
          if [ -f .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff ]; then
            FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
            cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_DIR"
            cd "$FLUTTER_DIR"
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg Cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg Dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              cat "$_1"
            done
            exit 1
          fi
        shell: bash

- name: Restore TopMostWindow Artifact
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Stage Driver & Virtual Display Bundle
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "./rustdesk" -Force | Out-Null
          Copy-Item -Path "usbmmidd_v2/*" -Destination "./rustdesk" -Recurse -Force

      - name: Build RustDesk via build.py (Single Standalone Executable)
        run: |
          # 1. Build Rust/Flutter release
          python3 .\build.py --portable --flutter --hwcodec ${{ matrix.job.build-args }}
          Copy-Item -Path "./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release/*" -Destination "./rustdesk" -Recurse -Force -ErrorAction SilentlyContinue
          
          # 2. Compile into single standalone executable using Inno Setup
          if (Test-Path "res\setup.iss") {
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" res\setup.iss
          }

      - name: Upload Specter Remote Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: SpecterRemote-Standalone-Exe
          path: |
            ./*.exe
            ./rustdesk/*.exe
            ./Output/*.exe