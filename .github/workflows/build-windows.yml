name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: windows-2022, platform: x64 }
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: Build Windows x64 Executable
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Bridge Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter SDK
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace Engine with RustDesk Custom Flutter Engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = Join-Path -Path (Split-Path (Get-Command flutter).Source) -ChildPath "cache/artifacts/engine/windows-x64-release"
          Copy-Item -Path windows-x64-release/* -Destination $engineDir -Recurse -Force

      - name: Patch Flutter Dropdown
        shell: bash
        run: |
          if [ -f .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff ]; then
            FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
            cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_DIR"
            cd "$FLUTTER_DIR"
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg Cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg Dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.job.vcpkg-triplet }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              cat "$_1"
            done
            exit 1
          fi
        shell: bash

      - name: Restore TopMostWindow Artifact
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Stage Driver & Virtual Display Bundle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "./rustdesk" -Force | Out-Null
          Copy-Item -Path "usbmmidd_v2/*" -Destination "./rustdesk" -Recurse -Force

- name: Build RustDesk & Package Artifacts
        shell: pwsh
        run: |
          # 1. Run the master build orchestrator
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram

          # 2. Populate the release staging directory
          New-Item -ItemType Directory -Path "./rustdesk" -Force | Out-Null
          Copy-Item -Path "./flutter/build/windows/x64/runner/Release/*" -Destination "./rustdesk" -Recurse -Force

          # 3. Attempt Inno Setup Single-File Packaging
          $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (Test-Path "res\setup.iss") {
            & $iscc /DAppVersion=1.3.8 /DOutputDir="$PWD" "res\setup.iss"
          }

          # 4. Search for the built executable and stage directly to ./SpecterRemote.exe
          $candidates = Get-ChildItem -Path . -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "vcpkg|tools|deviceinstaller|llvm|cmake" -and ($_.Name -like "*rustdesk*.exe" -or $_.Name -like "*setup*.exe") }

          Write-Host "Discovered built executables:"
          $candidates | ForEach-Object { Write-Host " -> $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

          # Prefer the largest standalone/setup executable, or fall back to the release binary
          $primaryExe = $candidates | Sort-Object Length -Descending | Select-Object -First 1
          if ($primaryExe) {
            Copy-Item -Path $primaryExe.FullName -Destination "./SpecterRemote.exe" -Force
            Write-Host "Staged primary executable: ./SpecterRemote.exe"
          } else {
            Copy-Item -Path "./flutter/build/windows/x64/runner/Release/rustdesk.exe" -Destination "./SpecterRemote.exe" -Force
          }

          # 5. Create companion zip bundle as secondary backup
          Compress-Archive -Path "./rustdesk/*" -DestinationPath "./SpecterRemote-FullBundle.zip" -Force

      - name: Upload Specter Remote Client
        uses: actions/upload-artifact@v4
        with:
          name: SpecterRemote-Windows-x64
          path: |
            ./SpecterRemote.exe
            ./SpecterRemote-FullBundle.zip